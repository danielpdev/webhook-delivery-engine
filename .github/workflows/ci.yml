name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://test:test-only@127.0.0.1:5432/portfolio_test

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen
      - run: make lint test eval
