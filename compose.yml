services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: demo
    ports: ["127.0.0.1:55444:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d demo"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  database:
